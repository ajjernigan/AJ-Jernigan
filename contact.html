<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - AJ Jernigan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header / Navigation -->
  <header>
    <div class="logo">AJ Jernigan</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="photos.html">Photos</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="voice-acting.html">Voice Acting</a></li>
        <li><a href="writing.html">Writing</a></li>
        <li><a href="contact.html">Contact AJ</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    <section class="content">
      <div class="container">
        <h1>Contact AJ</h1>

        <!-- Dynamic Firestore content -->
        <section id="contactContent"></section>

        <!-- Contact form -->
        <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <input type="text" name="name" placeholder="Your name" required>
          <input type="email" name="email" placeholder="Your email" required>
          <textarea name="message" placeholder="Your message" required></textarea>
          <button type="submit">Send</button>
        </form>

        <p id="formStatus"></p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="social-icons">
      <a href="#">Instagram</a>
      <a href="#">Bluesky</a>
      <a href="#">YouTube</a>
    </div>
    <p>&copy; 2025 AJ Jernigan</p>
  </footer>

  <!-- Scripts -->
  <script type="module" src="./js/contact.js"></script>
  <script type="module">
    import { loadPageContent } from "./js/content-loader.js";
    // Firestore doc ID = "contact"
    // Section ID = "contactContent"
    loadPageContent("contact", "contactContent");
  </script>
</body>
</html>
