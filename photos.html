<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos - AJ Jernigan</title>
<link rel="stylesheet" href="css/style.css">
<style>
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2rem;
  }
  nav ul.menu {
    list-style: none;
    display: flex;
    gap: 1rem;
    padding: 0;
  }
  nav ul.menu li a {
    text-decoration: none;
    font-weight: bold;
    color: #333;
  }
  nav ul.menu li a:hover {
    color: #007bff;
  }

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* Always 2 columns */
  gap: 2rem; /* space between photos */
  justify-items: center;
  margin: 2rem auto;
  max-width: 1600px; /* wider container */
}

.polaroid {
  background: #fff;
  padding: 10px 10px 20px 10px; /* smaller bottom padding so less “polaroid” white space */
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  text-align: center;
  max-width: 700px;  /* bigger images */
  width: 100%;
  border: 1px solid #ddd;
}

.polaroid img {
  width: 100%;
  height: auto;
  display: block;
}

.polaroid p {
  margin-top: 0.5rem;
  font-size: 1rem;
  font-style: italic;
}

/* Mobile: 1 column */
@media (max-width: 900px) {
  .photo-grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>
<body>
<header>
  <h1>AJ Jernigan – Photos</h1>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="voice-acting.html">Voice Acting</a></li>
      <li><a href="writing.html">Writing</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="photo-grid" id="photoGrid"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
  authDomain: "aj-jernigan-site.firebaseapp.com",
  projectId: "aj-jernigan-site",
  storageBucket: "aj-jernigan-site.appspot.com",
  messagingSenderId: "823081137921",
  appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPhotos() {
  const docRef = doc(db, "edits", "photos");
  const docSnap = await getDoc(docRef);

  let photos = docSnap.exists() ? docSnap.data().photos || [] : [];
  // Always show 6 slots
  while (photos.length < 6) {
    photos.push({ url: 'https://via.placeholder.com/250', caption: 'No caption' });
  }

  const grid = document.getElementById("photoGrid");
  grid.innerHTML = "";
  photos.forEach((item, i) => {
    const div = document.createElement("div");
    div.classList.add("polaroid");
    div.innerHTML = `
      <img src="${item.url}" alt="Photo ${i+1}">
      <p>${item.caption}</p>
    `;
    grid.appendChild(div);
  });
}

loadPhotos();
</script>
</body>
</html>
