<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main>
    <section id="loginSection">
      <h1>Admin Login</h1>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button id="loginBtn">Login</button>
      <p id="loginStatus"></p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const loginStatus = document.getElementById("loginStatus");

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginStatus.textContent = err.message;
      }
    });

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
