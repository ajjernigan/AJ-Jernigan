<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Editor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .video-container { display: flex; flex-wrap: wrap; gap: 20px; }
    .video-item { width: 320px; }
    iframe { width: 100%; height: 180px; border: none; }
  </style>
</head>
<body>
  <h1>Manage Videos</h1>

  <div>
    <input type="text" id="newVideoUrl" placeholder="Paste YouTube link" size="50" />
    <input type="text" id="newVideoCaption" placeholder="Caption (optional)" size="30" />
    <button id="addVideoBtn">Add Video</button>
  </div>

  <h2>Current Videos</h2>
  <div id="videosContainer" class="video-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    // --- Firebase init ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- DOM ---
    const addVideoBtn = document.getElementById("addVideoBtn");
    const newVideoUrl = document.getElementById("newVideoUrl");
    const newVideoCaption = document.getElementById("newVideoCaption");
    const videosContainer = document.getElementById("videosContainer");

    // --- Helper to extract YouTube ID ---
    function getYouTubeId(url) {
      const match = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    // --- Add video ---
    addVideoBtn.addEventListener("click", async () => {
      const rawUrl = newVideoUrl.value.trim();
      const caption = newVideoCaption.value.trim();
      const videoId = getYouTubeId(rawUrl);

      if (!videoId) {
        alert("Invalid YouTube link. Please paste a valid video URL.");
        return;
      }

      try {
        await addDoc(collection(db, "videos"), {
          videoId: videoId,
          caption: caption || "",
          createdAt: serverTimestamp()
        });
        newVideoUrl.value = "";
        newVideoCaption.value = "";
      } catch (err) {
        console.error("Error adding video:", err);
        alert("Failed to add video.");
      }
    });

    // --- Listen for updates ---
    onSnapshot(collection(db, "videos"), (snapshot) => {
      videosContainer.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const videoDiv = document.createElement("div");
        videoDiv.className = "video-item";
        videoDiv.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${data.videoId}" allowfullscreen></iframe>
          <p>${data.caption || ""}</p>
          <button data-id="${docSnap.id}">Delete</button>
        `;
        videoDiv.querySelector("button").addEventListener("click", async () => {
          await deleteDoc(doc(db, "videos", docSnap.id));
        });
        videosContainer.appendChild(videoDiv);
      });
    });
  </script>
</body>
</html>
