<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <ul id="pagesList">
      <li><a href="editor.html?page=index">Home</a></li>
      <li><a href="editor.html?page=resume">Resume</a></li>
      <li><a href="editor.html?page=photos">Photos</a></li>
      <li><a href="editor.html?page=videos">Videos</a></li>
      <li><a href="editor.html?page=voice-acting">Voice Acting</a></li>
      <li><a href="editor.html?page=writing">Writing</a></li>
    </ul>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const logoutBtn = document.getElementById("logoutBtn");

    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "login.html";
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
