<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .photos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1rem; }
    .photos-grid div { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    .photos-grid img { width: 100%; max-width: 200px; display: block; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Editing Page</h1>
    <button id="backBtn">Back to Dashboard</button>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <!-- Headshot Upload -->
    <section>
      <h2>Headshot</h2>
      <img id="headshotPreview" src="" alt="Current Headshot" style="max-width:200px; display:block; margin-bottom:1rem;">
      <input type="file" id="headshotInput" accept="image/*">
      <button id="uploadHeadshotBtn">Upload Headshot</button>
      <p id="headshotStatus"></p>
    </section>

    <!-- Intro Text -->
    <section>
      <h2>Intro Text</h2>
      <textarea id="editorArea" rows="20" cols="80"></textarea>
      <button id="saveBtn">Save Changes</button>
      <p id="saveStatus"></p>
    </section>

    <!-- Informal Reviews -->
    <section class="reviewsArea">
      <h2>Informal Reviews</h2>
      <div id="reviewsList"></div>
      <textarea id="newReview" rows="3" placeholder="Add a new review"></textarea>
      <button id="addReviewBtn">Add Review</button>
    </section>

    <!-- Photos Editor -->
    <section>
      <h2>Photos</h2>
      <div id="photosEditorGrid" class="photos-grid"></div>
      <button id="savePhotosBtn">Save Photos</button>
      <p id="photosStatus"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- Elements ---
    const page = new URLSearchParams(window.location.search).get("page") || "index";
    const pageTitle = document.getElementById("pageTitle");
    const backBtn = document.getElementById("backBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const editorArea = document.getElementById("editorArea");
    const saveBtn = document.getElementById("saveBtn");
    const saveStatus = document.getElementById("saveStatus");

    const headshotInput = document.getElementById("headshotInput");
    const uploadHeadshotBtn = document.getElementById("uploadHeadshotBtn");
    const headshotPreview = document.getElementById("headshotPreview");
    const headshotStatus = document.getElementById("headshotStatus");

    const reviewsList = document.getElementById("reviewsList");
    const newReview = document.getElementById("newReview");
    const addReviewBtn = document.getElementById("addReviewBtn");

    const photosEditorGrid = document.getElementById("photosEditorGrid");
    const savePhotosBtn = document.getElementById("savePhotosBtn");
    const photosStatus = document.getElementById("photosStatus");

    pageTitle.textContent = `Editing Page: ${page}`;

    // Auth check
    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "login.html";
    });

    // Back to dashboard
    backBtn.addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });

    // --- Load Page Content ---
    async function loadContent() {
      const docRef = doc(db, "edits", page);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        editorArea.value = data.introText || "";
        if (data.headshotUrl) headshotPreview.src = data.headshotUrl;
        loadReviews(data.reviews || []);
      }

      if (page === "photos") loadPhotosEditor();
    }

    // --- Reviews ---
    async function loadReviews(reviews) {
      reviewsList.innerHTML = "";
      reviews.forEach((review, i) => {
        const div = document.createElement("div");
        div.style.border = "1px solid #ccc";
        div.style.padding = "0.5rem";
        div.style.marginBottom = "0.5rem";
        div.contentEditable = true;
        div.textContent = review;
        div.dataset.index = i;

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.style.marginLeft = "1rem";
        deleteBtn.addEventListener("click", async () => {
          reviews.splice(i, 1);
          await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
          loadReviews(reviews);
        });

        div.addEventListener("blur", async () => {
          reviews[i] = div.textContent;
          await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
        });

        div.appendChild(deleteBtn);
        reviewsList.appendChild(div);
      });
    }

    addReviewBtn.addEventListener("click", async () => {
      const reviewText = newReview.value.trim();
      if (!reviewText) return;
      const docRef = doc(db, "edits", page);
      const docSnap = await getDoc(docRef);
      const reviews = docSnap.exists() ? docSnap.data().reviews || [] : [];
      reviews.push(reviewText);
      await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
      newReview.value = "";
      loadReviews(reviews);
    });

    // --- Save Intro ---
    saveBtn.addEventListener("click", async () => {
      await setDoc(doc(db, "edits", page), { introText: editorArea.value }, { merge: true });
      saveStatus.textContent = "Changes saved!";
    });

    // --- Headshot Upload ---
    uploadHeadshotBtn.addEventListener("click", async () => {
      const file = headshotInput.files[0];
      if (!file) return alert("Please select an image first.");
      headshotStatus.textContent = "Uploading...";

      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "aj_photos_upload");

        const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload", { method: "POST", body: formData });
        const data = await res.json();
        const url = data.secure_url;

        await setDoc(doc(db, "edits", page), { headshotUrl: url }, { merge: true });
        headshotPreview.src = url;
        headshotStatus.textContent = "Upload successful!";
      } catch (err) {
        console.error(err);
        headshotStatus.textContent = "Upload error: " + err.message;
      }
    });

    // --- Photos Editor ---
    let photosData = new Array(6).fill({url:"", caption:""});

    async function loadPhotosEditor() {
      const docRef = doc(db, "edits", "photos");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) photosData = docSnap.data().photos || photosData;

      photosEditorGrid.innerHTML = "";
      photosData.forEach((item, i) => {
        const div = document.createElement("div");
        div.innerHTML = `
          <img src="${item.url || 'https://via.placeholder.com/200'}" alt="Photo ${i+1}">
          <input type="file" id="photoFile${i}">
          <input type="text" id="photoCaption${i}" placeholder="Caption" value="${item.caption || ''}">
        `;
        photosEditorGrid.appendChild(div);
      });
    }

    savePhotosBtn.addEventListener("click", async () => {
      photosStatus.textContent = "Saving photos...";
      try {
        for (let i=0; i<photosData.length; i++) {
          const fileInput = document.getElementById(`photoFile${i}`);
          const captionInput = document.getElementById(`photoCaption${i}`);
          if (fileInput.files[0]) {
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("upload_preset", "aj_photos_upload");
            const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload", {method:"POST", body:formData});
            const data = await res.json();
            photosData[i].url = data.secure_url;
          }
          photosData[i].caption = captionInput.value;
        }

        await setDoc(doc(db, "edits", "photos"), { photos: photosData }, { merge: true });
        photosStatus.textContent = "Photos saved!";
      } catch(err) {
        console.error(err);
        photosStatus.textContent = "Error saving photos";
      }
    });

    // --- Logout ---
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    loadContent();
  </script>
</body>
</html>
