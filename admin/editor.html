<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    section { margin-bottom: 2rem; }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .photos-grid div {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: center;
    }
    .photos-grid img {
      width: 100%;
      max-width: 400px;
      display: block;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Editing Page</h1>
    <button id="backBtn">Back to Dashboard</button>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <!-- Headshot Upload -->
    <section id="headshotSection">
      <h2>Headshot</h2>
      <img id="headshotPreview" src="" alt="Current Headshot" style="max-width:200px; display:block; margin-bottom:1rem;">
      <input type="file" id="headshotInput" accept="image/*">
      <button id="uploadHeadshotBtn">Upload Headshot</button>
      <p id="headshotStatus"></p>
    </section>

    <!-- Intro Text -->
    <section id="introSection">
      <h2>Intro Text</h2>
      <textarea id="editorArea" rows="20" cols="80"></textarea>
      <button id="saveBtn">Save Changes</button>
      <p id="saveStatus"></p>
    </section>

    <!-- Informal Reviews -->
    <section class="reviewsArea" id="reviewsSection">
      <h2>Informal Reviews</h2>
      <div id="reviewsList"></div>
      <textarea id="newReview" rows="3" placeholder="Add a new review"></textarea>
      <button id="addReviewBtn">Add Review</button>
    </section>

    <!-- Photos Editor -->
    <section id="photosSection">
      <h2>Photos</h2>
      <input type="file" id="newPhotoInput" accept="image/*">
      <input type="text" id="newPhotoCaption" placeholder="Caption for new photo">
      <button id="uploadPhotoBtn">Upload New Photo</button>
      <p id="photosStatus"></p>
      <div id="photosEditorGrid" class="photos-grid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { 
      getFirestore, doc, getDoc, setDoc,
      collection, addDoc, getDocs, updateDoc, deleteDoc, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- Elements ---
    const page = new URLSearchParams(window.location.search).get("page") || "index";
    const pageTitle = document.getElementById("pageTitle");
    const backBtn = document.getElementById("backBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const headshotSection = document.getElementById("headshotSection");
    const introSection = document.getElementById("introSection");
    const reviewsSection = document.getElementById("reviewsSection");
    const photosSection = document.getElementById("photosSection");

    const editorArea = document.getElementById("editorArea");
    const saveBtn = document.getElementById("saveBtn");
    const saveStatus = document.getElementById("saveStatus");

    const headshotInput = document.getElementById("headshotInput");
    const uploadHeadshotBtn = document.getElementById("uploadHeadshotBtn");
    const headshotPreview = document.getElementById("headshotPreview");
    const headshotStatus = document.getElementById("headshotStatus");

    const reviewsList = document.getElementById("reviewsList");
    const newReview = document.getElementById("newReview");
    const addReviewBtn = document.getElementById("addReviewBtn");

    const photosEditorGrid = document.getElementById("photosEditorGrid");
    const newPhotoInput = document.getElementById("newPhotoInput");
    const newPhotoCaption = document.getElementById("newPhotoCaption");
    const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
    const photosStatus = document.getElementById("photosStatus");

    pageTitle.textContent = `Editing Page: ${page}`;

    // Auth check
    onAuthStateChanged(auth, user => { if (!user) window.location.href = "login.html"; });

    // Back to dashboard
    backBtn.addEventListener("click", () => window.location.href = "dashboard.html");

    // --- Show/hide sections based on page ---
    function updateSections() {
      headshotSection.style.display = page === "index" ? "block" : "none";
      introSection.style.display = (page === "index" || page === "resume") ? "block" : "none";
      reviewsSection.style.display = page === "index" ? "block" : "none";
      photosSection.style.display = page === "photos" ? "block" : "none";
    }
    updateSections();

    // --- Load Page Content ---
    async function loadContent() {
      const docRef = doc(db, "edits", page);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (page === "index" || page === "resume") editorArea.value = data.introText || "";
        if (page === "index" && data.headshotUrl) headshotPreview.src = data.headshotUrl;
        if (page === "index") loadReviews(data.reviews || []);
      }
      if (page === "photos") loadPhotosEditor();
    }

    // --- Reviews ---
    async function loadReviews(reviews) {
      reviewsList.innerHTML = "";
      reviews.forEach((review, i) => {
        const div = document.createElement("div");
        div.style.border = "1px solid #ccc";
        div.style.padding = "0.5rem";
        div.style.marginBottom = "0.5rem";
        div.contentEditable = true;
        div.textContent = review;

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.style.marginLeft = "1rem";
        deleteBtn.addEventListener("click", async () => {
          reviews.splice(i, 1);
          await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
          loadReviews(reviews);
        });

        div.addEventListener("blur", async () => {
          reviews[i] = div.textContent;
          await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
        });

        div.appendChild(deleteBtn);
        reviewsList.appendChild(div);
      });
    }

    addReviewBtn.addEventListener("click", async () => {
      const reviewText = newReview.value.trim();
      if (!reviewText) return;
      const docRef = doc(db, "edits", page);
      const docSnap = await getDoc(docRef);
      const reviews = docSnap.exists() ? docSnap.data().reviews || [] : [];
      reviews.push(reviewText);
      await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
      newReview.value = "";
      loadReviews(reviews);
    });

    // --- Save Intro ---
    saveBtn.addEventListener("click", async () => {
      await setDoc(doc(db, "edits", page), { introText: editorArea.value }, { merge: true });
      saveStatus.textContent = "Changes saved!";
    });

    // --- Headshot Upload ---
    uploadHeadshotBtn.addEventListener("click", async () => {
      const file = headshotInput.files[0];
      if (!file) return alert("Please select an image first.");
      headshotStatus.textContent = "Uploading...";

      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "aj_photos_upload");

        const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload", { method: "POST", body: formData });
        const data = await res.json();
        const url = data.secure_url;

        await setDoc(doc(db, "edits", page), { headshotUrl: url }, { merge: true });
        headshotPreview.src = url;
        headshotStatus.textContent = "Upload successful!";
      } catch (err) {
        console.error(err);
        headshotStatus.textContent = "Upload error: " + err.message;
      }
    });

    // --- Photos Editor ---
    async function loadPhotosEditor() {
      const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);

      photosEditorGrid.innerHTML = "";
      snap.forEach(docSnap => {
        const item = docSnap.data();
        const id = docSnap.id;

        const div = document.createElement("div");
        div.innerHTML = `
          <img src="${item.url}" alt="Photo">
          <input type="text" value="${item.caption || ''}" id="caption-${id}" placeholder="Edit caption">
          <button data-id="${id}" class="saveCaptionBtn">Save Caption</button>
          <button data-id="${id}" class="deletePhotoBtn">Delete</button>
        `;
        photosEditorGrid.appendChild(div);
      });

      // Caption save listeners
      document.querySelectorAll(".saveCaptionBtn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const caption = document.getElementById(`caption-${id}`).value;
          await updateDoc(doc(db, "photos", id), { caption });
          photosStatus.textContent = "Caption updated!";
        });
      });

      // Delete listeners
      document.querySelectorAll(".deletePhotoBtn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          await deleteDoc(doc(db, "photos", id));
          loadPhotosEditor();
        });
      });
    }

    uploadPhotoBtn.addEventListener("click", async () => {
      const file = newPhotoInput.files[0];
      const caption = newPhotoCaption.value;
      if (!file) return alert("Please select a photo!");

      photosStatus.textContent = "Uploading...";

      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "aj_photos_upload");

        const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        const url = data.secure_url;

        await addDoc(collection(db, "photos"), {
          url,
          caption,
          createdAt: new Date()
        });

        newPhotoInput.value = "";
        newPhotoCaption.value = "";
        photosStatus.textContent = "Photo uploaded!";
        loadPhotosEditor();
      } catch (err) {
        console.error(err);
        photosStatus.textContent = "Error uploading photo.";
      }
    });

    // --- Logout ---
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    loadContent();
  </script>
</body>
</html>
