<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .photo-card {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: center;
      background: #fff;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    }
    .photo-card img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Editor</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <!-- Main Menu -->
    <section id="editorMenu">
      <h2>Choose a page to edit</h2>
      <button id="editHeadshotBtn">Headshot</button>
      <button id="editIntroBtn">Intro Text</button>
      <button id="editReviewsBtn">Informal Reviews</button>
      <button id="editPhotosBtn">Photos</button>
    </section>

    <!-- Headshot Editor -->
    <section id="headshotEditor" style="display:none;">
      <button class="backBtn">← Back</button>
      <h2>Headshot</h2>
      <img id="headshotPreview" src="" alt="Current Headshot" style="max-width:200px; display:block; margin-bottom:1rem;">
      <input type="file" id="headshotInput" accept="image/*">
      <button id="uploadHeadshotBtn">Upload Headshot</button>
      <p id="headshotStatus"></p>
    </section>

    <!-- Intro Text Editor -->
    <section id="introEditor" style="display:none;">
      <button class="backBtn">← Back</button>
      <h2>Intro Text</h2>
      <textarea id="editorArea" rows="20" cols="80"></textarea>
      <button id="saveBtn">Save Changes</button>
      <p id="saveStatus"></p>
    </section>

    <!-- Reviews Editor -->
    <section id="reviewsEditor" style="display:none;">
      <button class="backBtn">← Back</button>
      <h2>Informal Reviews</h2>
      <div id="reviewsList"></div>
      <textarea id="newReview" rows="3" placeholder="Add a new review"></textarea>
      <button id="addReviewBtn">Add Review</button>
    </section>

    <!-- Photos Editor -->
    <section id="photosEditor" style="display:none;">
      <button class="backBtn">← Back</button>
      <h2>Photos</h2>
      <div class="photo-grid" id="photoGrid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const page = "index";
    const editorMenu = document.getElementById("editorMenu");

    // Auth check
    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "login.html";
    });

    // --- Toggle sections ---
    function showSection(sectionId) {
      document.querySelectorAll("main section").forEach(sec => sec.style.display = "none");
      document.getElementById(sectionId).style.display = "block";
    }

    document.querySelectorAll(".backBtn").forEach(btn => {
      btn.addEventListener("click", () => showSection("editorMenu"));
    });

    document.getElementById("editHeadshotBtn").addEventListener("click", () => showSection("headshotEditor"));
    document.getElementById("editIntroBtn").addEventListener("click", () => showSection("introEditor"));
    document.getElementById("editReviewsBtn").addEventListener("click", () => { showSection("reviewsEditor"); loadReviewsFromDB(); });
    document.getElementById("editPhotosBtn").addEventListener("click", () => { showSection("photosEditor"); loadPhotos(); });

    // --- Intro Text ---
    const editorArea = document.getElementById("editorArea");
    const saveBtn = document.getElementById("saveBtn");
    const saveStatus = document.getElementById("saveStatus");
    saveBtn.addEventListener("click", async () => {
      await setDoc(doc(db, "edits", page), { introText: editorArea.value }, { merge: true });
      saveStatus.textContent = "Changes saved!";
    });

    // --- Reviews ---
    const reviewsList = document.getElementById("reviewsList");
    const newReview = document.getElementById("newReview");
    const addReviewBtn = document.getElementById("addReviewBtn");
    async function loadReviewsFromDB() {
      const docRef = doc(db, "edits", page);
      const docSnap = await getDoc(docRef);
      const reviews = docSnap.exists() ? docSnap.data().reviews || [] : [];
      loadReviews(reviews);
    }
    function loadReviews(reviews) {
      reviewsList.innerHTML = "";
      reviews.forEach((review, i) => {
        const div = document.createElement("div");
        div.style.border = "1px solid #ccc";
        div.style.padding = "0.5rem";
        div.style.marginBottom = "0.5rem";
        div.contentEditable = true;
        div.textContent = review;

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.style.marginLeft = "1rem";
        deleteBtn.addEventListener("click", async () => {
          reviews.splice(i, 1);
          await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
          loadReviews(reviews);
        });

        div.addEventListener("blur", async () => {
          reviews[i] = div.textContent;
          await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
        });

        div.appendChild(deleteBtn);
        reviewsList.appendChild(div);
      });
    }
    addReviewBtn.addEventListener("click", async () => {
      const reviewText = newReview.value.trim();
      if (!reviewText) return;
      const docRef = doc(db, "edits", page);
      const docSnap = await getDoc(docRef);
      const reviews = docSnap.exists() ? docSnap.data().reviews || [] : [];
      reviews.push(reviewText);
      await setDoc(doc(db, "edits", page), { reviews }, { merge: true });
      newReview.value = "";
      loadReviews(reviews);
    });

    // --- Headshot Upload (same as before, with compression + Cloudinary) ---
    const headshotInput = document.getElementById("headshotInput");
    const uploadHeadshotBtn = document.getElementById("uploadHeadshotBtn");
    const headshotPreview = document.getElementById("headshotPreview");
    const headshotStatus = document.getElementById("headshotStatus");
    uploadHeadshotBtn.addEventListener("click", async () => {
      const file = headshotInput.files[0];
      if (!file) return alert("Please select an image first.");
      headshotStatus.textContent = "Compressing and uploading...";
      try {
        const compressedFile = await imageCompression(file, { maxSizeMB: 2, maxWidthOrHeight: 2000, useWebWorker: true });
        const formData = new FormData();
        formData.append("file", compressedFile);
        formData.append("upload_preset", "aj_photos_upload");
        const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload", { method: "POST", body: formData });
        if (!res.ok) throw new Error("Cloudinary upload failed");
        const data = await res.json();
        const url = data.secure_url;
        await setDoc(doc(db, "edits", page), { headshotUrl: url }, { merge: true });
        headshotPreview.src = url;
        headshotStatus.textContent = "Upload successful!";
      } catch (err) {
        console.error(err);
        headshotStatus.textContent = "Upload error: " + err.message;
      }
    });

    // --- Photos Grid Editing ---
    const photoGrid = document.getElementById("photoGrid");
    async function loadPhotos() {
      const docRef = doc(db, "edits", "photos");
      const docSnap = await getDoc(docRef);
      const photos = docSnap.exists() ? docSnap.data().photos || [] : Array(6).fill({ url: "", caption: "" });
      photoGrid.innerHTML = "";
      photos.forEach((photo, i) => {
        const card = document.createElement("div");
        card.className = "photo-card";
        const img = document.createElement("img");
        img.src = photo.url || "https://via.placeholder.com/300x200?text=Upload+Photo";
        const captionInput = document.createElement("input");
        captionInput.type = "text";
        captionInput.value = photo.caption || "";
        captionInput.placeholder = "Caption";

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";

        const uploadBtn = document.createElement("button");
        uploadBtn.textContent = "Upload";

        uploadBtn.addEventListener("click", async () => {
          const file = fileInput.files[0];
          if (!file) return alert("Select an image first.");
          uploadBtn.textContent = "Uploading...";
          try {
            const compressedFile = await imageCompression(file, { maxSizeMB: 2, maxWidthOrHeight: 2000, useWebWorker: true });
            const formData = new FormData();
            formData.append("file", compressedFile);
            formData.append("upload_preset", "aj_photos_upload");
            const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload", { method: "POST", body: formData });
            if (!res.ok) throw new Error("Upload failed");
            const data = await res.json();
            const url = data.secure_url;
            photos[i] = { url, caption: captionInput.value };
            await setDoc(doc(db, "edits", "photos"), { photos }, { merge: true });
            img.src = url;
            uploadBtn.textContent = "Upload";
          } catch (err) {
            console.error(err);
            uploadBtn.textContent = "Error";
          }
        });

        captionInput.addEventListener("blur", async () => {
          photos[i].caption = captionInput.value;
          await setDoc(doc(db, "edits", "photos"), { photos }, { merge: true });
        });

        card.appendChild(img);
        card.appendChild(captionInput);
        card.appendChild(fileInput);
        card.appendChild(uploadBtn);
        photoGrid.appendChild(card);
      });
    }

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
