<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* Simple polaroid style for photos grid */
    .photo-slot {
      display: inline-block;
      margin: 10px;
      text-align: center;
      width: 200px;
    }
    .photo-slot img {
      width: 100%;
      border: 1px solid #ccc;
      padding: 5px;
      background: white;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }
    .photo-slot input {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Editing Page</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <!-- Home Page Sections -->
    <section id="headshotEditor" style="display:none">
      <h2>Headshot</h2>
      <img id="headshotPreview" src="" alt="Current Headshot" style="max-width:200px; display:block; margin-bottom:1rem;">
      <input type="file" id="headshotInput" accept="image/*">
      <button id="uploadHeadshotBtn">Upload Headshot</button>
      <p id="headshotStatus"></p>
    </section>

    <section id="introEditor" style="display:none">
      <h2>Intro Text</h2>
      <textarea id="editorArea" rows="10" cols="80"></textarea>
      <button id="saveBtn">Save Changes</button>
      <p id="saveStatus"></p>
    </section>

    <section id="reviewsEditor" style="display:none">
      <h2>Informal Reviews</h2>
      <div id="reviewsList"></div>
      <textarea id="newReview" rows="3" placeholder="Add a new review"></textarea>
      <button id="addReviewBtn">Add Review</button>
    </section>

    <!-- Photos Page Editor -->
    <section id="photosEditor" style="display:none">
      <h2>Photos Grid</h2>
      <div id="photosGrid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Get page from URL
    const urlParams = new URLSearchParams(window.location.search);
    const page = urlParams.get("page") || "index";

    const pageTitle = document.getElementById("pageTitle");
    pageTitle.textContent = `Editing Page: ${page}`;

    // Back to dashboard button
    const backBtn = document.createElement("button");
    backBtn.textContent = "← Back to Dashboard";
    backBtn.style.marginLeft = "1rem";
    backBtn.addEventListener("click", () => window.location.href = "dashboard.html");
    pageTitle.parentElement.insertBefore(backBtn, pageTitle.nextSibling);

    // Logout
    const logoutBtn = document.getElementById("logoutBtn");
    onAuthStateChanged(auth, user => { if(!user) window.location.href="login.html"; });
    logoutBtn.addEventListener("click", async()=>{ await signOut(auth); window.location.href="login.html"; });

    // --- HOME PAGE EDITORS ---
    const headshotInput = document.getElementById("headshotInput");
    const uploadHeadshotBtn = document.getElementById("uploadHeadshotBtn");
    const headshotPreview = document.getElementById("headshotPreview");
    const headshotStatus = document.getElementById("headshotStatus");
    const editorArea = document.getElementById("editorArea");
    const saveBtn = document.getElementById("saveBtn");
    const saveStatus = document.getElementById("saveStatus");
    const reviewsList = document.getElementById("reviewsList");
    const newReview = document.getElementById("newReview");
    const addReviewBtn = document.getElementById("addReviewBtn");

    async function loadContent() {
      const docRef = doc(db,"edits",page);
      const docSnap = await getDoc(docRef);
      if(docSnap.exists()){
        const data = docSnap.data();
        editorArea.value = data.introText || "";
        if(data.headshotUrl) headshotPreview.src = data.headshotUrl;
        loadReviews(data.reviews || []);
      }
    }

    async function loadReviews(reviews){
      reviewsList.innerHTML = "";
      reviews.forEach((review,i)=>{
        const div = document.createElement("div");
        div.style.border="1px solid #ccc";
        div.style.padding="0.5rem";
        div.style.marginBottom="0.5rem";
        div.contentEditable = true;
        div.textContent = review;
        div.dataset.index=i;

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent="Delete";
        deleteBtn.style.marginLeft="1rem";
        deleteBtn.addEventListener("click", async ()=>{
          reviews.splice(i,1);
          await setDoc(doc(db,"edits",page),{reviews},{merge:true});
          loadReviews(reviews);
        });

        div.addEventListener("blur", async ()=>{
          reviews[i]=div.textContent;
          await setDoc(doc(db,"edits",page),{reviews},{merge:true});
        });

        div.appendChild(deleteBtn);
        reviewsList.appendChild(div);
      });
    }

    saveBtn.addEventListener("click", async()=>{
      await setDoc(doc(db,"edits",page),{introText:editorArea.value},{merge:true});
      saveStatus.textContent="Changes saved!";
    });

    uploadHeadshotBtn.addEventListener("click", async()=>{
      const file=headshotInput.files[0];
      if(!file)return alert("Please select an image first.");
      headshotStatus.textContent="Uploading...";

      try{
        const options={ maxSizeMB:2, maxWidthOrHeight:2000, useWebWorker:true };
        const compressedFile = await imageCompression(file,options);

        const formData = new FormData();
        formData.append("file",compressedFile);
        formData.append("upload_preset","aj_photos_upload");

        const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload",{
          method:"POST", body:formData
        });

        if(!res.ok) throw new Error("Cloudinary upload failed");
        const data=await res.json();
        const url=data.secure_url;
        await setDoc(doc(db,"edits",page),{headshotUrl:url},{merge:true});
        headshotPreview.src=url;
        headshotStatus.textContent="Upload successful!";
      }catch(err){
        console.error(err);
        headshotStatus.textContent="Upload error: "+err.message;
      }
    });

    addReviewBtn.addEventListener("click", async()=>{
      const reviewText=newReview.value.trim();
      if(!reviewText) return;
      const docRef=doc(db,"edits",page);
      const docSnap=await getDoc(docRef);
      const reviews=docSnap.exists()? docSnap.data().reviews||[]:[];
      reviews.push(reviewText);
      await setDoc(doc(db,"edits",page),{reviews},{merge:true});
      newReview.value="";
      loadReviews(reviews);
    });

    // --- PHOTOS PAGE EDITOR ---
    const photosGrid = document.getElementById("photosGrid");
    async function loadPhotos(){
      const docRef = doc(db,"edits","photos");
      const docSnap = await getDoc(docRef);
      const data = docSnap.exists()? docSnap.data() : {};
      photosGrid.innerHTML="";
      for(let i=0;i<6;i++){
        const slotDiv=document.createElement("div");
        slotDiv.className="photo-slot";

        const img = document.createElement("img");
        img.src = data[`photo${i}`]?.url || "";
        img.alt = `Photo ${i+1}`;

        const fileInput = document.createElement("input");
        fileInput.type="file";
        fileInput.accept="image/*";

        const captionInput = document.createElement("input");
        captionInput.type="text";
        captionInput.placeholder="Caption";
        captionInput.value = data[`photo${i}`]?.caption || "";

        const uploadBtn = document.createElement("button");
        uploadBtn.textContent="Upload";
        uploadBtn.addEventListener("click", async()=>{
          if(!fileInput.files[0]) return alert("Select a file");
          try{
            const options={ maxSizeMB:2, maxWidthOrHeight:2000, useWebWorker:true };
            const compressedFile = await imageCompression(fileInput.files[0],options);

            const formData = new FormData();
            formData.append("file",compressedFile);
            formData.append("upload_preset","aj_photos_upload");

            const res = await fetch("https://api.cloudinary.com/v1_1/dzktijdmh/image/upload",{
              method:"POST",body:formData
            });
            if(!res.ok) throw new Error("Upload failed");
            const result=await res.json();
            const url=result.secure_url;
            await setDoc(doc(db,"edits","photos"),{[`photo${i}`]:{url,caption:captionInput.value}},{merge:true});
            img.src=url;
            alert("Upload successful!");
          }catch(err){ console.error(err); alert("Upload error: "+err.message); }
        });

        captionInput.addEventListener("blur", async()=>{
          await setDoc(doc(db,"edits","photos"),{[`photo${i}`]:{url:img.src,caption:captionInput.value}},{merge:true});
        });

        slotDiv.appendChild(img);
        slotDiv.appendChild(fileInput);
        slotDiv.appendChild(captionInput);
        slotDiv.appendChild(uploadBtn);
        photosGrid.appendChild(slotDiv);
      }
    }

    // --- Show relevant editor based on page ---
    if(page==="index"){ document.getElementById("headshotEditor").style.display="block";
                        document.getElementById("introEditor").style.display="block";
                        document.getElementById("reviewsEditor").style.display="block";
                        loadContent();
    } else if(page==="photos"){
      document.getElementById("photosEditor").style.display="block";
      loadPhotos();
    } else {
      // fallback for other pages
      document.getElementById("introEditor").style.display="block";
      loadContent();
    }
  </script>
</body>
</html>
