<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - AJ Jernigan</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    section { margin-bottom: 2rem; }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .photos-grid div {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: center;
    }
    .photos-grid img {
      width: 100%;
      max-width: 400px;
      display: block;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Editing Page</h1>
    <button id="backBtn">Back to Dashboard</button>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <!-- Headshot Upload -->
    <section id="headshotSection">
      <h2>Headshot</h2>
      <img id="headshotPreview" src="" alt="Current Headshot" style="max-width:200px; display:block; margin-bottom:1rem;">
      <input type="file" id="headshotInput" accept="image/*">
      <button id="uploadHeadshotBtn">Upload Headshot</button>
      <p id="headshotStatus"></p>
    </section>

    <!-- Intro Text -->
    <section id="introSection">
      <h2>Intro Text</h2>
      <textarea id="editorArea" rows="20" cols="80"></textarea>
      <button id="saveBtn">Save Changes</button>
      <p id="saveStatus"></p>
    </section>

    <!-- Informal Reviews -->
    <section class="reviewsArea" id="reviewsSection">
      <h2>Informal Reviews</h2>
      <div id="reviewsList"></div>
      <textarea id="newReview" rows="3" placeholder="Add a new review"></textarea>
      <button id="addReviewBtn">Add Review</button>
    </section>

    <!-- Photos Editor -->
    <section id="photosSection">
      <h2>Photos</h2>
      <input type="file" id="newPhotoInput" accept="image/*">
      <input type="text" id="newPhotoCaption" placeholder="Caption for new photo">
      <button id="uploadPhotoBtn">Upload New Photo</button>
      <p id="photosStatus"></p>
      <div id="photosEditorGrid" class="photos-grid"></div>
    </section>
  </main>
