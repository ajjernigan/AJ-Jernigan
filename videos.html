<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - AJ Jernigan</title>
<link rel="stylesheet" href="css/style.css">
<style>
  main { padding: 2rem; max-width: 900px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 2rem; }
  .video-card {
    margin-bottom: 2rem;
    text-align: center;
  }
  .video-card iframe {
    width: 80%;
    max-width: 800px;
    height: 450px;
    border: none;
    border-radius: 8px;
  }
  .caption {
    margin-top: 0.5rem;
    font-style: italic;
    color: #444;
    font-size: 1.1rem;
  }
  .video-card img {
    width: 80%;
    max-width: 800px;
    border-radius: 8px;
    cursor: pointer;
  }
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .thumbnail-wrapper {
    position: relative;
    display: inline-block;
  }
</style>
</head>
<body>
<header>
  <h1>Videos</h1>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="voice-acting.html">Voice Acting</a></li>
      <li><a href="writing.html">Writing</a></li>
    </ul>
  </nav>
</header>

<main id="videosGrid"></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
  authDomain: "aj-jernigan-site.firebaseapp.com",
  projectId: "aj-jernigan-site",
  storageBucket: "aj-jernigan-site.appspot.com",
  messagingSenderId: "823081137921",
  appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const videosGrid = document.getElementById("videosGrid");

function extractYouTubeID(url) {
  const regExp = /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=)([^#&?]*).*/;
  const match = url.match(regExp);
  return (match && match[1].length === 11) ? match[1] : null;
}

async function loadVideos() {
  try {
    const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    videosGrid.innerHTML = "";

    snap.forEach(docSnap => {
      const data = docSnap.data();
      if (!data.url) return;
      const videoId = extractYouTubeID(data.url);
      if (!videoId) return;

      const div = document.createElement("div");
      div.className = "video-card";

      div.innerHTML = `
        <div class="thumbnail-wrapper">
          <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="Video Thumbnail">
          <div class="play-btn">▶</div>
        </div>
        <div class="caption">${data.title || ""}</div>
      `;

      const thumbnail = div.querySelector("img");
      thumbnail.addEventListener("click", () => {
        div.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
          <div class="caption">${data.title || ""}</div>
        `;
      });

      videosGrid.appendChild(div);
    });
  } catch (err) {
    console.error("Error loading videos:", err);
    videosGrid.innerHTML = "<p>Error loading videos. Check console.</p>";
  }
}

loadVideos();
</script>
</body>
</html>
