<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - AJ Jernigan</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  header {
    text-align: center;
    padding: 2rem 0 1rem 0;
    background-color: #f8f8f8;
  }
  header h1 { margin-bottom: 1rem; }

  nav ul.menu {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  nav ul.menu li {
    margin: 0;
  }
  nav ul.menu li a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    transition: background 0.3s;
  }
  nav ul.menu li a:hover {
    background-color: #ddd;
  }

  main { padding: 2rem; }

  .videos-grid {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    align-items: center;
  }

  .video-card {
    width: 90%;
    max-width: 1000px;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 ratio */
  }

  .video-wrapper iframe,
  .video-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 8px;
  }

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  .caption {
    text-align: center;
    margin-top: 0.5rem;
    font-style: italic;
    color: #444;
  }
</style>
</head>
<body>
<header>
  <h1>Videos</h1>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="voice-acting.html">Voice Acting</a></li>
      <li><a href="writing.html">Writing</a></li>
    </ul>
  </nav>
</header>

<main>
  <div id="videosGrid" class="videos-grid"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
  authDomain: "aj-jernigan-site.firebaseapp.com",
  projectId: "aj-jernigan-site",
  storageBucket: "aj-jernigan-site.appspot.com",
  messagingSenderId: "823081137921",
  appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const videosGrid = document.getElementById("videosGrid");

function extractYouTubeID(url) {
  const regExp = /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=)([^#&?]*).*/;
  const match = url.match(regExp);
  return (match && match[1].length === 11) ? match[1] : null;
}

async function loadVideos() {
  const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);
  videosGrid.innerHTML = "";

  snap.forEach(docSnap => {
    const data = docSnap.data();
    const videoId = extractYouTubeID(data.url);
    if (!videoId) return;

    const div = document.createElement("div");
    div.className = "video-card";

    div.innerHTML = `
      <div class="video-wrapper">
        <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="Video Thumbnail">
        <div class="play-btn">▶</div>
      </div>
      <div class="caption">${data.caption || ""}</div>
    `;

    const thumbnail = div.querySelector("img");
    thumbnail.addEventListener("click", () => {
      div.innerHTML = `
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="caption">${data.caption || ""}</div>
      `;
    });

    videosGrid.appendChild(div);
  });
}

loadVideos();
</script>
</body>
</html>
