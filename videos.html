<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - AJ Jernigan</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2rem;
  }

  nav ul.menu {
    list-style: none;
    display: flex;
    gap: 1rem;
    padding: 0;
  }

  nav ul.menu li a {
    text-decoration: none;
    font-weight: bold;
    color: #333;
  }

  nav ul.menu li a:hover {
    color: #007bff;
  }

  header h1 {
    margin-bottom: 0.5rem;
  }

  nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    gap: 1.5rem;
  }

  main {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .videos-grid {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    width: 100%;
    max-width: 1200px;
  }

  .video-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 aspect ratio */
    border-radius: 8px;
    overflow: hidden;
  }

  .video-wrapper iframe,
  .video-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 8px;
  }

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  .caption {
    text-align: center;
    font-style: italic;
    color: #444;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
<header>
  <h1>Videos</h1>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="voice-acting.html">Voice Acting</a></li>
      <li><a href="writing.html">Writing</a></li>
    </ul>
  </nav>
</header>

<main>
  <div id="videosGrid" class="videos-grid"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
  authDomain: "aj-jernigan-site.firebaseapp.com",
  projectId: "aj-jernigan-site",
  storageBucket: "aj-jernigan-site.appspot.com",
  messagingSenderId: "823081137921",
  appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const videosGrid = document.getElementById("videosGrid");

function extractYouTubeID(url) {
  const regExp = /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=)([^#&?]*).*/;
  const match = url.match(regExp);
  return (match && match[1].length === 11) ? match[1] : null;
}

async function loadVideos() {
  const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);
  videosGrid.innerHTML = "";

  snap.forEach(docSnap => {
    const data = docSnap.data();
    const videoId = extractYouTubeID(data.url);
    if (!videoId) return;

    const div = document.createElement("div");
    div.className = "video-card";

    // video-wrapper with thumbnail
    const wrapper = document.createElement("div");
    wrapper.className = "video-wrapper";
    wrapper.innerHTML = `
      <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="Video Thumbnail">
      <div class="play-btn">▶</div>
    `;

    // caption div
    const captionDiv = document.createElement("div");
    captionDiv.className = "caption";
    captionDiv.textContent = data.caption || "";

    // click to replace thumbnail with iframe
    const thumbnail = wrapper.querySelector("img");
    thumbnail.addEventListener("click", () => {
      wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
    });

    div.appendChild(wrapper);
    div.appendChild(captionDiv);
    videosGrid.appendChild(div);
  });
}

loadVideos();
</script>
</body>
</html>
