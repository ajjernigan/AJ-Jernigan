  <div id="resumeContent">Loading resume...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

   
    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadResume() {
      const docRef = doc(db, "edits", "resume");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        document.getElementById("resumeContent").innerHTML = docSnap.data().content;
      } else {
        document.getElementById("resumeContent").innerHTML = "No resume found.";
      }
    }

    loadResume();
  </script>
</body>
