<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AJ Jernigan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- HEADER WITH VIDEO BACKGROUND -->
<header class="hero-header">
  <video src="assets/videos/backgroundvid.mp4" autoplay muted playsinline></video>
  <nav class="hero-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="voice-acting.html">Voice Acting</a></li>
      <li><a href="writing.html">Writing</a></li>
      <li><a href="contact.html">Contact AJ</a></li>
    </ul>
  </nav>
  <div class="hero-content">
    <h1>Welcome to AJ Jernigan</h1>
    <p>Actor • Voice Artist • Writer</p>
  </div>
</header>

  <!-- INTRO AREA -->
  <section class="introArea">
    <div class="left">
      <img id="introImage" src="" alt="AJ Jernigan">
    </div>
    <div class="right">
      <div id="introText"></div>
    </div>
  </section>

  <!-- FIREBASE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3AuU1ZUK23LqewXhUPLeC_q3BG6mBN2I",
      authDomain: "aj-jernigan-site.firebaseapp.com",
      projectId: "aj-jernigan-site",
      storageBucket: "aj-jernigan-site.appspot.com",
      messagingSenderId: "823081137921",
      appId: "1:823081137921:web:8dc8a9d7fdddbf49048d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadIndexContent() {
      try {
        const snap = await getDoc(doc(db, "edits", "index"));
        if (snap.exists()) {
          const data = snap.data();
          if (data.headshotUrl) {
            document.getElementById("introImage").src = data.headshotUrl;
          }
          if (data.introText) {
            document.getElementById("introText").innerHTML = data.introText;
          }
        } else {
          console.log("⚠️ No content found for index page in Firestore.");
        }
      } catch (err) {
        console.error("Error loading index content:", err);
      }
    }

    loadIndexContent();
  </script>
</body>
</html>
